{% extends "docente/base.html" %}

{% block content %}
<div class="container mt-4">
    <h5>Editar comentario</h5>

    <div class="card mt-3">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    {{ form.texto.label_tag }}
                    {{ form.texto }}
                    {% if form.texto.errors %}
                        <div class="text-danger small">
                            {{ form.texto.errors }}
                        </div>
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar cambios
                </button>
                <a href="{% url 'comentar_cita' comentario.cita.id %}"
                   class="btn btn-secondary ms-2">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
